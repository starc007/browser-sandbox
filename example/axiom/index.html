<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuildFlow – Premium SaaS for Modern Teams</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0F0F0F;
      color: #E5E5E5;
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Inter Tight', sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .heading-xl {
      font-size: 3.5rem;
      line-height: 1.1;
      font-family: 'Inter Tight', sans-serif;
      font-weight: 900;
    }

    .heading-lg {
      font-size: 2.5rem;
      line-height: 1.15;
      font-family: 'Inter Tight', sans-serif;
      font-weight: 800;
    }

    .heading-md {
      font-size: 1.75rem;
      line-height: 1.2;
      font-family: 'Inter Tight', sans-serif;
      font-weight: 700;
    }

    .accent {
      color: #00D9FF;
    }

    .btn-primary {
      background-color: #00D9FF;
      color: #0F0F0F;
      font-weight: 600;
      padding: 0.875rem 1.75rem;
      border-radius: 0.375rem;
      transition: all 0.2s ease;
      border: 2px solid #00D9FF;
      cursor: pointer;
    }

    .btn-primary:hover {
      background-color: #00BFCC;
      border-color: #00BFCC;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      color: #E5E5E5;
      font-weight: 600;
      padding: 0.875rem 1.75rem;
      border-radius: 0.375rem;
      transition: all 0.2s ease;
      border: 2px solid #333333;
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: #00D9FF;
      color: #00D9FF;
      transform: translateY(-2px);
    }

    .gradient-blur {
      position: relative;
      overflow: hidden;
    }

    .gradient-blur::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 217, 255, 0.15) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    .grain {
      position: relative;
    }

    .grain::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3C/filter%3E%3Crect width='400' height='400' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.5;
    }

    .scroll-fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: scrollFadeIn 0.6s ease forwards;
    }

    @keyframes scrollFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stagger-item {
      animation: scrollFadeIn 0.6s ease forwards;
    }

    .stagger-item:nth-child(1) { animation-delay: 0.1s; }
    .stagger-item:nth-child(2) { animation-delay: 0.2s; }
    .stagger-item:nth-child(3) { animation-delay: 0.3s; }
    .stagger-item:nth-child(4) { animation-delay: 0.4s; }
    .stagger-item:nth-child(5) { animation-delay: 0.5s; }
    .stagger-item:nth-child(6) { animation-delay: 0.6s; }

    .diagonal-line {
      position: absolute;
      width: 200px;
      height: 2px;
      background: linear-gradient(90deg, #00D9FF 0%, transparent 100%);
      transform: rotate(-15deg);
    }

    .card-overlap {
      transition: all 0.3s ease;
    }

    .card-overlap:hover {
      transform: translateY(-4px);
    }

    .pricing-highlight {
      border: 2px solid #00D9FF;
      box-shadow: 0 0 40px rgba(0, 217, 255, 0.2);
    }

    .accordion-button {
      background: transparent;
      border: none;
      color: #E5E5E5;
      font-family: 'Inter Tight', sans-serif;
      font-size: 1.125rem;
      font-weight: 600;
      text-align: left;
      padding: 1.25rem 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      transition: color 0.2s ease;
    }

    .accordion-button:hover {
      color: #00D9FF;
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      color: #999999;
      line-height: 1.6;
    }

    .accordion-content.open {
      max-height: 500px;
      padding-bottom: 1rem;
    }

    .testimonial-card {
      background: #1A1A1A;
      border: 1px solid #222222;
      border-radius: 0.5rem;
      padding: 2rem;
      transition: all 0.3s ease;
    }

    .testimonial-card:hover {
      border-color: #00D9FF;
      background: #1F1F1F;
    }

    .nav-sticky {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 15, 15, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222222;
    }

    @media (max-width: 768px) {
      .heading-xl {
        font-size: 2rem;
      }

      .heading-lg {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
