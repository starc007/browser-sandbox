<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Sandbox — Example</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        background: #1a1a1a;
        color: #e0e0e0;
      }
      h1 {
        margin-top: 0;
      }
      section {
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.25rem;
        font-weight: 600;
      }
      select {
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        background: #2a2a2a;
        color: #e0e0e0;
        border: 1px solid #444;
        border-radius: 6px;
        min-width: 140px;
      }
      input[type="file"] {
        display: block;
        margin-top: 0.25rem;
        color: #999;
        font-size: 0.9rem;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
        cursor: pointer;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        margin-top: 0.5rem;
      }
      button:hover {
        background: #2563eb;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 0.5rem;
        padding: 0.5rem;
        border-radius: 4px;
        min-height: 1.5rem;
      }
      #status.ok {
        background: #166534;
        color: #bbf7d0;
      }
      #status.err {
        background: #991b1b;
        color: #fecaca;
      }
      #status.loading {
        background: #1e3a5f;
        color: #93c5fd;
      }
      #preview {
        margin-top: 1rem;
        border: 1px solid #444;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }
      #preview iframe {
        display: block;
        width: 100%;
        height: 600px;
        border: none;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        align-items: flex-end;
      }
      .field {
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <h1>Browser Sandbox — Example</h1>
    <p>
      Upload your project folder (or files), choose the framework, and build.
      Only source files (e.g. .js, .jsx, .ts, .tsx, .html, .json, .css) are
      used; config and other files are ignored.
    </p>

    <section>
      <div class="row">
        <div class="field">
          <label for="framework">Framework</label>
          <select id="framework">
            <option value="react">React</option>
            <option value="vanilla">Vanilla</option>
          </select>
        </div>
        <div class="field">
          <label for="folder-input">Project folder</label>
          <input type="file" id="folder-input" webkitdirectory multiple />
        </div>
        <div class="field">
          <label for="files-input">Or select files</label>
          <input
            type="file"
            id="files-input"
            multiple
            accept=".js,.jsx,.ts,.tsx,.html,.json,.css"
          />
        </div>
        <div class="field">
          <button type="button" id="run-build">Build</button>
        </div>
      </div>
      <div id="status"></div>
    </section>

    <section id="preview" style="display: none">
      <label>Preview</label>
      <iframe id="iframe" title="Sandbox preview"></iframe>
    </section>

    <script type="module">
      const statusEl = document.getElementById("status");
      const iframeEl = document.getElementById("iframe");
      const previewEl = document.getElementById("preview");
      const folderInput = document.getElementById("folder-input");
      const filesInput = document.getElementById("files-input");
      const frameworkSelect = document.getElementById("framework");

      const ALLOWED_EXT = /\.(js|jsx|ts|tsx|html|json|css)$/i;
      const IGNORE_DIRS =
        /(^|[\/\\])(node_modules|\.git|dist|build|__pycache__)([\/\\]|$)/;
      const IGNORE_FILES =
        /(^|[\/\\])(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb|\.npmrc|\.yarnrc|tsconfig\.json|jsconfig\.json|vite\.config\.(js|ts|mjs)|webpack\.config\.(js|ts)|rollup\.config\.(js|ts)|esbuild\.config\.(js|ts)|tailwind\.config\.(js|ts)|postcss\.config\.(js|json))$/i;

      function setStatus(msg, type = "") {
        statusEl.textContent = msg;
        statusEl.className = type;
      }

      function pathFromFile(file) {
        let path;
        if (file.webkitRelativePath) {
          const normalized = file.webkitRelativePath.replace(/\\/g, "/");
          const parts = normalized.split("/");
          if (parts.length > 1) parts.shift();
          path = parts.join("/");
        } else {
          path = file.name;
        }
        return path.replace(/\\/g, "/");
      }

      function shouldInclude(path) {
        const normalized = path.replace(/\\/g, "/");
        if (IGNORE_DIRS.test(normalized)) return false;
        if (IGNORE_FILES.test(normalized)) return false;
        return ALLOWED_EXT.test(normalized);
      }

      async function buildFilesFromInput() {
        const folderList = folderInput.files;
        const filesList = filesInput.files;
        const fileList = folderList?.length ? folderList : filesList;
        if (!fileList?.length) {
          throw new Error("Select a project folder or individual files first.");
        }
        const files = {};
        for (const file of fileList) {
          const path = pathFromFile(file);
          if (!shouldInclude(path)) continue;
          const text = await file.text();
          files[path] = text;
        }
        if (Object.keys(files).length === 0) {
          throw new Error(
            "No source files found. Include .js, .jsx, .ts, .tsx, .html, .json, or .css."
          );
        }
        return files;
      }

      async function run() {
        setStatus("Loading…", "loading");
        previewEl.style.display = "none";
        try {
          const files = await buildFilesFromInput();
          console.log("files", files);
          const framework = frameworkSelect.value;
          console.log("framework", framework);
          const { buildSandbox } = await import("./dist/ai-browser-sandbox.js");
          setStatus("Building…", "loading");

          let url = "";
          let error = null;
          switch (framework) {
            case "react":
              ({ url, error } = await buildSandbox({
                files,
                framework: "react",
              }));
              break;
            case "vanilla":
              ({ url, error } = await buildSandbox({
                files,
                framework: "vanilla",
              }));
              break;
            default:
              ({ url, error } = await buildSandbox({ files, framework }));
          }

          if (error) {
            setStatus(error, "err");
            return;
          }
          setStatus("Done. Preview below.", "ok");
          iframeEl.src = url;
          previewEl.style.display = "block";
        } catch (err) {
          const msg = err instanceof Error ? err.message : String(err);
          setStatus(msg, "err");
        }
      }

      document.getElementById("run-build").addEventListener("click", run);
    </script>
  </body>
</html>
